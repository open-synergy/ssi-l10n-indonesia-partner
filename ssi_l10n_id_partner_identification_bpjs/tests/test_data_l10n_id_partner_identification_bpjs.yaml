scenarios:
  - name: "BPJS Identification - Compute, inverse and search on res.partner"
    steps:
      - step: "Create partner for BPJS test"
        action: "create"
        model: "res.partner"
        save_as: "partner"
        values:
          name: "Test Partner BPJS"

      - step: "Set BPJS Kesehatan number"
        action: "write"
        target: "partner"
        values:
          bpjs_kesehatan_number: "0001234567890"

      - step: "Assert BPJS Kesehatan number is set"
        action: "assert"
        target: "partner"
        asserts:
          bpjs_kesehatan_number:
            type: "value"
            expected: "0001234567890"

      - step: "Set BPJS Ketenagakerjaan number"
        action: "write"
        target: "partner"
        values:
          bpjs_ketenagakerjaan_number: "0009876543210"

      - step: "Assert BPJS Ketenagakerjaan number is set"
        action: "assert"
        target: "partner"
        asserts:
          bpjs_ketenagakerjaan_number:
            type: "value"
            expected: "0009876543210"

      - step: "Search partner by BPJS Kesehatan number"
        action: "search"
        model: "res.partner"
        domain:
          - ["bpjs_kesehatan_number", "=", "0001234567890"]
        save_as: "partners_by_bpjs_kes"
        expect_count: 1

      - step: "Assert partner found by BPJS Kesehatan"
        action: "assert"
        target: "partners_by_bpjs_kes"
        asserts:
          bpjs_kesehatan_number:
            type: "value"
            expected: "0001234567890"

      - step: "Search partner by BPJS Ketenagakerjaan number"
        action: "search"
        model: "res.partner"
        domain:
          - ["bpjs_ketenagakerjaan_number", "=", "0009876543210"]
        save_as: "partners_by_bpjs_ker"
        expect_count: 1

      - step: "Assert partner found by BPJS Ketenagakerjaan"
        action: "assert"
        target: "partners_by_bpjs_ker"
        asserts:
          bpjs_ketenagakerjaan_number:
            type: "value"
            expected: "0009876543210"
